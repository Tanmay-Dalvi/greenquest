services:
  # Backend API Service
  - type: web
    name: greenquest-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MODEL_PROVIDER
        value: fallback
      - key: FORCE_FALLBACK
        value: "true"
      - key: CORS_ORIGINS
        value: "*"

  # Frontend Static Site
  - type: web
    name: greenquest-pwa
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: greenquest-api
          property: host

